<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Thi Mạng Máy Tính: Ngân Hàng Câu Hỏi Trắc Nghiệm Toàn Diện</title>
    <link rel="stylesheet" href="./styles.css">

</head>
<body>

<div class="container">
    <header>
        <h1>📚 Ngân Hàng Câu Hỏi Mạng Máy Tính (Hợp Nhất)</h1>
        <div class="global-stats">
            <span class="badge" id="badge-total-questions"></span>
            <span class="badge badge-neutral">8 Chương / Chủ đề</span>
            <span class="badge badge-success">✓ Hiện đáp án tức thì từng câu</span>
            <span class="badge badge-neutral">✓ Đã lọc trùng & chuẩn hóa</span>
        </div>
        <p id="session-status" class="session-status" role="status"></p>
    </header>

    <div class="controls-card">
        <label for="chapter-select"><strong>📖 Chọn Chương để Luyện tập:</strong></label>
        <select id="chapter-select">
            <option value="">-- Vui lòng chọn một chương --</option>
            <option value="ALL">🌟 Tất cả các chương</option>
        </select>

        <div class="toolbar">
            <label class="toggle-label" title="Khi bật: Chỉ cần nhấp vào đáp án là hệ thống kiểm tra và hiện đúng/sai ngay lập tức">
                <input type="checkbox" id="auto-check-toggle" checked>
                <span>⚡ Tự động hiện đáp án đúng ngay khi chọn</span>
            </label>

            <div class="chapter-actions">
                <button type="button" class="btn-secondary" id="btn-show-all-answers" title="Hiện đáp án đúng của tất cả câu trong phần này">👁️ Hiện tất cả đáp án</button>
                <button type="button" class="btn-secondary" id="btn-reset-chapter" title="Làm lại từ đầu phần này">🔄 Làm lại phần này</button>
            </div>
        </div>
    </div>

    <!-- Active Chapter Info -->
    <div id="chapter-banner" class="chapter-header" style="display: none;">
        <h2 id="chapter-title">Chương</h2>
        <div class="chapter-stats">
            <span>Tổng số: <strong id="chapter-total-q">0</strong> câu hỏi</span>
            <span>Đã làm: <strong id="chapter-done-q">0</strong> câu</span>
            <span>Đúng: <strong id="chapter-correct-q" style="color: #4ade80;">0</strong></span>
            <span>Sai: <strong id="chapter-wrong-q" style="color: #f87171;">0</strong></span>
            <span>Tỷ lệ đúng: <strong id="chapter-accuracy">0%</strong></span>
        </div>
        <div class="progress-bar-container">
            <div id="progress-fill" class="progress-bar-fill"></div>
        </div>
    </div>

    <!-- Quiz Content -->
    <div id="quiz-container">
        <div id="questions-list">
            <div class="empty-placeholder">
                <svg viewBox="0 0 24 24">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                </svg>
                <p>Vui lòng chọn một chương ở menu phía trên để bắt đầu luyện tập câu hỏi trắc nghiệm!</p>
            </div>
        </div>
    </div>
</div>

<script src="./data/questions.js"></script>
<script src="./js/session-store.js"></script>
<script src="./js/app.js"></script>

</body>
</html>
